<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Windows Support Alert Simulation</title>
<style>
  body {
    margin: 0;
    background-color: #0078D7;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
  }
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #005A9E;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
  }
  .logo {
    width: 100px;
    height: auto;
  }
  .popup {
    margin-top: 80px;
    background: #fff;
    color: #000;
    border: 4px solid red; /* red border */
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,0,0,0.9);
    padding: 20px;
    text-align: center;
    max-width: 500px;
  }
  .popup h1 {
    color: red;
    font-size: 22px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .popup p {
    margin: 10px 0;
    font-weight: bold;
  }
  .popup input {
    width: 80%;
    padding: 8px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .popup button {
    padding: 8px 16px;
    margin: 10px;
    border: none;
    border-radius: 4px;
    background: red;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
  }
  .popup button:hover {
    background: darkred;
  }
  .bottom-section {
    margin-top: 30px;
    background: #005A9E;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    width: 80%;
  }
  .bottom-section h2 {
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .bottom-section p {
    margin-bottom: 20px;
  }
  .bottom-section button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 4px;
    background: red;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
  }
  .bottom-section button:hover {
    background: darkred;
  }
  .esc-cue {
    position: fixed;
    bottom: 10px;
    right: 10px;
    font-size: 12px;
    opacity: 0.6;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="top-bar">
    <!-- Inline Microsoft logo -->
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
      <rect width="120" height="120" x="0" y="0" fill="#FFFFFF"/>
      <rect width="120" height="120" x="136" y="0" fill="#FFFFFF"/>
      <rect width="120" height="120" x="0" y="136" fill="#FFFFFF"/>
      <rect width="120" height="120" x="136" y="136" fill="#FFFFFF"/>
    </svg>
    <span>Toll Free: +1 917-814-6549</span>
  </div>

  <div class="popup">
    <h1>VIRUS ALERT FROM MICROSOFT</h1>
    <p>This computer is BLOCKED</p>
    <p>Enter Windows registration key:</p>
    <input type="text" placeholder="Enter key here">
    <button>Submit</button>
    <button>Cancel</button>
    <p style="margin-top:20px; font-size:12px; opacity:0.7;">⚠️.</p>
  </div>

  <div class="bottom-section">
    <h2>Windows Support Alert</h2>
    <p>Your system has detected suspicious activity. Please contact support immediately.</p>
    <button>Ignore Alert</button>
    <button>Chat Now</button>
  </div>

  <div class="esc-cue">Press ESC to close this window</div>

  <!-- Alarm sound -->
  <audio id="alarm" autoplay loop>
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

<script>
  // Fullscreen triggers
  function goFull() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }
  window.onload = function() {
    goFull();
    // Play alarm
    document.getElementById('alarm').play().catch(()=>{});
  };
  document.addEventListener('mousemove', goFull);
  document.addEventListener('click', goFull);

  // Prevent closing except ESC
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.close();
    } else {
      e.preventDefault();
    }
  });
</script>
</body>
</html>
